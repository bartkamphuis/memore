<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img"><title>Bi-encoder versus cross-encoder</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40" y="30" width="290" height="250" rx="20" class="dash"/><rect x="350" y="30" width="290" height="250" rx="20" class="dash"/>
<text class="th" x="185" y="61" text-anchor="middle">Bi-encoder, today</text><text class="th" x="495" y="61" text-anchor="middle">Cross-encoder reranker</text>
<rect class="coral" x="65" y="80" width="110" height="44" rx="8"/><text class="th" x="120" y="107" text-anchor="middle">Query</text>
<rect class="coral" x="195" y="80" width="110" height="44" rx="8"/><text class="th" x="250" y="107" text-anchor="middle">Fact</text>
<line x1="120" y1="124" x2="120" y2="146" class="arr" marker-end="url(#a)"/><line x1="250" y1="124" x2="250" y2="146" class="arr" marker-end="url(#a)"/>
<rect class="coral" x="65" y="150" width="110" height="44" rx="8"/><text class="ts" x="120" y="176" text-anchor="middle">vector</text>
<rect class="coral" x="195" y="150" width="110" height="44" rx="8"/><text class="ts" x="250" y="176" text-anchor="middle">vector</text>
<line x1="120" y1="194" x2="120" y2="211" class="arr" marker-end="url(#a)"/><line x1="250" y1="194" x2="250" y2="211" class="arr" marker-end="url(#a)"/>
<rect class="coral" x="65" y="215" width="240" height="44" rx="8"/><text class="th" x="185" y="242" text-anchor="middle">One dot product</text>
<rect class="teal" x="375" y="80" width="240" height="44" rx="8"/><text class="th" x="495" y="107" text-anchor="middle">Query and fact together</text>
<line x1="495" y1="124" x2="495" y2="146" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="375" y="150" width="240" height="44" rx="8"/><text class="th" x="495" y="177" text-anchor="middle">Tokens interact</text>
<line x1="495" y1="194" x2="495" y2="211" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="375" y="215" width="240" height="44" rx="8"/><text class="th" x="495" y="242" text-anchor="middle">Score</text>
<text class="ts" x="340" y="320" text-anchor="middle">Separate encodings cannot see that the entity differs. A joint one can.</text></svg>
