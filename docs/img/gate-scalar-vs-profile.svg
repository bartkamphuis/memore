<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img"><title>Gate as a calibrated profile</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect class="purple" x="50" y="40" width="130" height="56" rx="8"/><text class="th" x="115" y="63" text-anchor="middle">Score shape</text><text class="ts" x="115" y="81" text-anchor="middle">peak, margin, spread</text>
<rect class="purple" x="200" y="40" width="130" height="56" rx="8"/><text class="th" x="265" y="63" text-anchor="middle">Subject evidence</text><text class="ts" x="265" y="81" text-anchor="middle">named, competing</text>
<rect class="purple" x="350" y="40" width="130" height="56" rx="8"/><text class="th" x="415" y="63" text-anchor="middle">Query shape</text><text class="ts" x="415" y="81" text-anchor="middle">form, length, verb</text>
<rect class="purple" x="500" y="40" width="130" height="56" rx="8"/><text class="th" x="565" y="63" text-anchor="middle">Store shape</text><text class="ts" x="565" y="81" text-anchor="middle">size, crowding</text>
<path d="M115 96L265 146" class="arr" marker-end="url(#a)"/><path d="M265 96L305 146" class="arr" marker-end="url(#a)"/>
<path d="M415 96L375 146" class="arr" marker-end="url(#a)"/><path d="M565 96L415 146" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="240" y="150" width="200" height="56" rx="8"/><text class="th" x="340" y="173" text-anchor="middle">Fitted model</text><text class="ts" x="340" y="191" text-anchor="middle">small, deterministic</text>
<line x1="340" y1="206" x2="340" y2="240" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="240" y="244" width="200" height="56" rx="8"/><text class="th" x="340" y="267" text-anchor="middle">P(useful)</text><text class="ts" x="340" y="285" text-anchor="middle">calibrated, not a score</text>
<path d="M300 300L145 334" class="arr" marker-end="url(#a)"/><line x1="340" y1="300" x2="340" y2="334" class="arr" marker-end="url(#a)"/><path d="M380 300L535 334" class="arr" marker-end="url(#a)"/>
<rect class="gray" x="60" y="338" width="170" height="56" rx="8"/><text class="th" x="145" y="361" text-anchor="middle">Inject block</text><text class="ts" x="145" y="379" text-anchor="middle">high confidence</text>
<rect class="gray" x="255" y="338" width="170" height="56" rx="8"/><text class="th" x="340" y="361" text-anchor="middle">Inject, attributed</text><text class="ts" x="340" y="379" text-anchor="middle">middle band</text>
<rect class="gray" x="450" y="338" width="170" height="56" rx="8"/><text class="th" x="535" y="361" text-anchor="middle">Stay shut</text><text class="ts" x="535" y="379" text-anchor="middle">low confidence</text>
<text class="ts" x="340" y="430" text-anchor="middle">Policy owns the thresholds. The model only reports how likely the hit is to help.</text></svg>
