<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img"><title>Read path latency budget</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect class="coral" x="60" y="80" width="190" height="48" rx="4"/>
<rect class="teal" x="250" y="80" width="11" height="48"/>
<rect class="gray" x="261" y="80" width="50" height="48"/>
<rect x="311" y="80" width="309" height="48" rx="4" class="dash"/>
<text class="ts" x="60" y="60">200ms budget, measured p95 at ~90ms</text>
<rect class="coral" x="180" y="168" width="12" height="12" rx="2"/><text class="ts" x="205" y="177">Embedder — 68ms, of which ~50 is per-call model load</text>
<rect class="teal" x="180" y="198" width="12" height="12" rx="2"/><text class="ts" x="205" y="207">FalkorDB lookup — 4ms</text>
<rect class="gray" x="180" y="228" width="12" height="12" rx="2"/><text class="ts" x="205" y="237">Subject check, block build, everything else — 18ms</text>
<rect x="180" y="258" width="12" height="12" rx="2" class="dash"/><text class="ts" x="205" y="267">Unused — 110ms</text>
<text class="ts" x="340" y="310" text-anchor="middle">Optimising the store would recover 2% of a budget that is already half empty.</text></svg>
