<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img"><title>The loop and the instrument inside it</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<path id="outer" d="M 590 250 A 250 170 0 1 1 90 250 A 250 170 0 1 1 590 250" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 5"/>
<path id="inner" d="M 450 250 A 110 70 0 1 1 230 250 A 110 70 0 1 1 450 250" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 4"/>
<rect class="teal" x="275" y="58" width="130" height="44" rx="8"/><text class="th" x="340" y="85" text-anchor="middle">Question</text>
<rect class="teal" x="491" y="143" width="130" height="44" rx="8"/><text class="th" x="556" y="170" text-anchor="middle">Hypothesis</text>
<rect class="teal" x="491" y="313" width="130" height="44" rx="8"/><text class="th" x="556" y="340" text-anchor="middle">Apparatus</text>
<rect class="teal" x="275" y="398" width="130" height="44" rx="8"/><text class="th" x="340" y="425" text-anchor="middle">Run</text>
<rect class="teal" x="59" y="313" width="130" height="44" rx="8"/><text class="th" x="124" y="340" text-anchor="middle">Result</text>
<rect class="teal" x="59" y="143" width="130" height="44" rx="8"/><text class="th" x="124" y="170" text-anchor="middle">Record</text>
<rect class="purple" x="250" y="222" width="180" height="56" rx="8"/><text class="th" x="340" y="245" text-anchor="middle">Instrument</text><text class="ts" x="340" y="263" text-anchor="middle">closes first, or not at all</text>
<circle class="coral" cx="465" cy="397" r="4"/><text class="ts" x="500" y="432" text-anchor="middle">bar written here</text>
<circle r="7" fill="#6b7280" opacity="0.85"><animateMotion dur="11s" repeatCount="indefinite"><mpath href="#outer"/></animateMotion></circle>
<circle r="5" fill="#6b7280" opacity="0.5"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#inner"/></animateMotion></circle>
<text class="ts" x="340" y="492" text-anchor="middle">The inner loop turns three times for every outer turn. That ratio is the finding.</text></svg>
