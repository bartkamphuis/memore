<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img"><title>Peak versus plateau</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40" y="28" width="290" height="302" rx="20" class="dash"/><rect x="350" y="28" width="290" height="302" rx="20" class="dash"/>
<text class="th" x="185" y="61" text-anchor="middle">Store has this fact</text>
<text class="th" x="495" y="61" text-anchor="middle">Store has this kind of fact</text>
<rect class="teal" x="59" y="120" width="32" height="160" rx="4"/><rect class="teal" x="103" y="230" width="32" height="50" rx="4"/><rect class="teal" x="147" y="240" width="32" height="40" rx="4"/><rect class="teal" x="191" y="245" width="32" height="35" rx="4"/><rect class="teal" x="235" y="255" width="32" height="25" rx="4"/><rect class="teal" x="279" y="260" width="32" height="20" rx="4"/>
<rect class="coral" x="369" y="140" width="32" height="140" rx="4"/><rect class="coral" x="413" y="145" width="32" height="135" rx="4"/><rect class="coral" x="457" y="150" width="32" height="130" rx="4"/><rect class="coral" x="501" y="155" width="32" height="125" rx="4"/><rect class="coral" x="545" y="160" width="32" height="120" rx="4"/><rect class="coral" x="589" y="170" width="32" height="110" rx="4"/>
<line x1="50" y1="240" x2="320" y2="240" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
