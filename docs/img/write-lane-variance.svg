<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img"><title>Current write lane</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect class="gray" x="250" y="30" width="180" height="44" rx="8"/><text class="th" x="340" y="57" text-anchor="middle">Turn + slot hints</text>
<line x1="340" y1="74" x2="340" y2="106" class="arr" marker-end="url(#a)"/>
<rect class="coral" x="60" y="110" width="560" height="150" rx="20"/><text class="th" x="340" y="143" text-anchor="middle">P1, one call</text>
<rect class="coral" x="80" y="164" width="118" height="56" rx="8"/><text class="th" x="139" y="187" text-anchor="middle">Extract</text><text class="ts" x="139" y="205" text-anchor="middle">fact text</text>
<rect class="coral" x="214" y="164" width="118" height="56" rx="8"/><text class="th" x="273" y="187" text-anchor="middle">Subject</text><text class="ts" x="273" y="205" text-anchor="middle">topic name</text>
<rect class="coral" x="348" y="164" width="118" height="56" rx="8"/><text class="th" x="407" y="187" text-anchor="middle">Attribute</text><text class="ts" x="407" y="205" text-anchor="middle">slot name</text>
<rect class="coral" x="482" y="164" width="118" height="56" rx="8"/><text class="th" x="541" y="187" text-anchor="middle">Cardinality</text><text class="ts" x="541" y="205" text-anchor="middle">single_valued</text>
<line x1="340" y1="260" x2="340" y2="296" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="200" y="300" width="280" height="56" rx="8"/><text class="th" x="340" y="323" text-anchor="middle">Exact-match join</text><text class="ts" x="340" y="341" text-anchor="middle">on generated strings</text>
<line x1="340" y1="356" x2="340" y2="386" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="200" y="390" width="280" height="56" rx="8"/><text class="th" x="340" y="413" text-anchor="middle">Classify and supersede</text><text class="ts" x="340" y="431" text-anchor="middle">max(serial), no LLM</text>
<text class="ts" x="340" y="482" text-anchor="middle">Coral varies run to run at temperature 0. Teal is deterministic.</text></svg>
