<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" role="img"><title>Two-stage write lane</title><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.th{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#6b7280}.teal{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.coral{fill:#ffe4e6;stroke:#f43f5e;stroke-width:1}.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1}.arr{stroke:#9ca3af;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect class="gray" x="190" y="30" width="300" height="56" rx="8"/><text class="th" x="340" y="53" text-anchor="middle">Extract, no vocabulary</text><text class="ts" x="340" y="71" text-anchor="middle">turn's own words, parallel</text>
<line x1="340" y1="86" x2="340" y2="112" class="arr" marker-end="url(#a)"/>
<rect class="purple" x="190" y="116" width="300" height="56" rx="8"/><text class="th" x="340" y="139" text-anchor="middle">Block for candidates</text><text class="ts" x="340" y="157" text-anchor="middle">vector kNN plus IDF tokens</text>
<line x1="340" y1="172" x2="340" y2="198" class="arr" marker-end="url(#a)"/>
<rect class="purple" x="190" y="202" width="300" height="56" rx="8"/><text class="th" x="340" y="225" text-anchor="middle">Match, pairwise</text><text class="ts" x="340" y="243" text-anchor="middle">same entity, same slot, yes or no</text>
<line x1="340" y1="258" x2="340" y2="284" class="arr" marker-end="url(#a)"/>
<rect class="purple" x="190" y="288" width="300" height="56" rx="8"/><text class="th" x="340" y="311" text-anchor="middle">Link</text><text class="ts" x="340" y="329" text-anchor="middle">assign entity and slot ids</text>
<line x1="340" y1="344" x2="340" y2="370" class="arr" marker-end="url(#a)"/>
<rect class="teal" x="190" y="374" width="300" height="56" rx="8"/><text class="th" x="340" y="397" text-anchor="middle">Consolidate, unchanged</text><text class="ts" x="340" y="415" text-anchor="middle">max(serial) on ids, no LLM</text>
<text class="ts" x="340" y="466" text-anchor="middle">Purple is new. The consolidation primitive keeps its inputs and its guarantees.</text></svg>
